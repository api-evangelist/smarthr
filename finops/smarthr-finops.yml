description: >-
  FinOps view of SmartHR spend. SmartHR is a per-employee, per-month SaaS
  subscription billed in Japanese yen (JPY). The dominant cost driver is
  headcount (number of registered employees / "crews") multiplied by the
  per-employee rate of the chosen plan tier, plus the functional scope of that
  tier (labor administration vs. talent management vs. combined). The API and
  webhooks are included with the platform subscription rather than metered as a
  separate line item, so API usage does not generate incremental invoice cost -
  cost changes when headcount or plan tier changes.
notes: >-
  Per-employee JPY rates are not publicly listed (quote-based), so unit rates are
  not reconciled here. There is a free tier up to 30 employees. Verify tier
  rates and headcount-based totals on the SmartHR pricing page during
  reconciliation.
