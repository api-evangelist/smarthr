meters:
- name: registered_employees
  description: Number of registered employees (crews) - the primary per-seat billing driver, priced per employee per month.
  unit: employees
  aggregation: max
  dimensions:
  - tenant
  - plan_tier
- name: plan_tier
  description: Functional scope of the subscription (labor administration, talent management, or combined HR strategy).
  unit: tier
  aggregation: last
  dimensions:
  - tenant
- name: api_access
  description: API and webhook access, included with the platform subscription (no separate metered charge).
  unit: included
  aggregation: last
  dimensions:
  - tenant
principles:
- name: Visibility
  description: Track registered employee headcount per tenant against the per-employee plan rate; headcount at contract time drives the bill.
- name: Allocation
  description: Map SmartHR cost to HR/People-Ops cost centers; allocate by department or business establishment where multiple entities share a tenant.
- name: Optimization
  description: Right-size the plan tier to the functions actually used, and reconcile registered vs. active employees so retired records do not inflate seat counts.
- name: Accountability
  description: Review headcount and plan tier before renewal; SmartHR requires a plan review when employee count grows.
