aid: smarthr
url: https://raw.githubusercontent.com/api-evangelist/smarthr/refs/heads/main/apis.yml
name: SmartHR
kind: company
description: SmartHR is a leading Japanese cloud HR, labor, and personnel management
  SaaS (smarthr.jp). Its per-tenant REST API exposes an organization's employee
  ("crew") records and the master data around them - departments, employment types,
  business establishments, and custom field templates - plus webhook subscriptions
  for change notifications. The API is served from each customer's own tenant
  subdomain (https://{tenant}.smarthr.jp/api) under a /v1 path, and is authenticated
  with a per-tenant access token passed as a Bearer token.
