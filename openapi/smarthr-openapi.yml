openapi: 3.0.3
info:
  title: SmartHR API
  description: >-
    The SmartHR API is a per-tenant REST API for the SmartHR cloud HR / labor and
    personnel management platform (smarthr.jp). It exposes an organization's
    employee ("crew") records and the master data around them - departments,
    employment types, custom field templates, business establishments - plus
    webhook subscriptions for change notifications. The API is served from each
    customer's own tenant subdomain (https://{tenant}.smarthr.jp/api) and all
    resources live under the /v1 path. Authentication is a per-tenant access
    token passed as a Bearer token (or via HTTP Basic with the token as the
    username).

    This document models a representative, grounded subset of the API. The
    endpoints below are confirmed against SmartHR's published API reference and
    the community Go SDK (github.com/ktsujichan/smarthr-sdk-go). SmartHR's full
    API reference documents additional resources (dependents, bank accounts,
    payrolls, positions, job titles, tags, companies, and more) that are not
    modeled here.
  version: '1.0'
  contact:
    name: SmartHR for Developers
    url: https://developer.smarthr.jp/
  termsOfService: https://developer.smarthr.jp/terms/index.html
servers:
  - url: https://{tenant}.smarthr.jp/api
    description: >-
      Production tenant. Replace {tenant} with your SmartHR subdomain. Each
      customer has their own subdomain; there is no single shared host.
    variables:
      tenant:
        default: your-subdomain
        description: The customer's SmartHR tenant subdomain.
security:
  - bearerAuth: []
tags:
  - name: Crews
    description: Employee ("crew") records - the core personnel objects in SmartHR.
  - name: Departments
    description: Organizational departments that crews belong to.
  - name: Employment Types
    description: Employment type master data (full-time, part-time, contract, etc.).
  - name: Custom Field Templates
    description: Templates defining custom fields attached to crew records.
  - name: Business Establishments
    description: Business establishments (jigyosho) registered for the tenant.
  - name: Webhooks
    description: Webhook subscriptions that notify external systems of changes.
paths:
  /v1/crews:
    get:
      operationId: listCrews
      tags:
        - Crews
      summary: List crews
      description: >-
        Lists employee (crew) records for the tenant. Supports pagination via
        page and per_page, sorting via sort, and filtering by employment status
        and other attributes.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: sort
          in: query
          required: false
          description: Property to sort by, for example emp_status.
          schema:
            type: string
        - name: emp_status
          in: query
          required: false
          description: Filter by employment status.
          schema:
            type: string
            enum:
              - employed
              - absent
              - retired
      responses:
        '200':
          description: A page of crew records.
          headers:
            x-total-count:
              $ref: '#/components/headers/XTotalCount'
            x-rate-limit-remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Crew'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createCrew
      tags:
        - Crews
      summary: Create a crew
      description: Creates a new employee (crew) record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrewInput'
      responses:
        '201':
          description: The created crew record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/crews/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getCrew
      tags:
        - Crews
      summary: Get a crew
      description: Retrieves a single employee (crew) record by ID.
      responses:
        '200':
          description: The requested crew record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateCrew
      tags:
        - Crews
      summary: Update a crew
      description: Updates an existing employee (crew) record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrewInput'
      responses:
        '200':
          description: The updated crew record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteCrew
      tags:
        - Crews
      summary: Delete a crew
      description: Deletes an employee (crew) record.
      responses:
        '204':
          description: The crew record was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/crews/{id}/invite:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: inviteCrew
      tags:
        - Crews
      summary: Invite a crew
      description: >-
        Sends a SmartHR account invitation to the employee (crew) so they can
        log in and complete their own profile.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                crew_input_form_id:
                  type: string
                  description: Optional ID of the input form to attach to the invitation.
      responses:
        '200':
          description: The invitation was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Crew'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/departments:
    get:
      operationId: listDepartments
      tags:
        - Departments
      summary: List departments
      description: Lists departments for the tenant.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of departments.
          headers:
            x-total-count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createDepartment
      tags:
        - Departments
      summary: Create a department
      description: Creates a new department.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '201':
          description: The created department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/departments/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getDepartment
      tags:
        - Departments
      summary: Get a department
      description: Retrieves a single department by ID.
      responses:
        '200':
          description: The requested department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateDepartment
      tags:
        - Departments
      summary: Update a department
      description: Updates an existing department.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentInput'
      responses:
        '200':
          description: The updated department.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteDepartment
      tags:
        - Departments
      summary: Delete a department
      description: Deletes a department.
      responses:
        '204':
          description: The department was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/employment_types:
    get:
      operationId: listEmploymentTypes
      tags:
        - Employment Types
      summary: List employment types
      description: Lists employment type master records for the tenant.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of employment types.
          headers:
            x-total-count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmploymentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createEmploymentType
      tags:
        - Employment Types
      summary: Create an employment type
      description: Creates a new employment type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentTypeInput'
      responses:
        '201':
          description: The created employment type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/employment_types/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getEmploymentType
      tags:
        - Employment Types
      summary: Get an employment type
      description: Retrieves a single employment type by ID.
      responses:
        '200':
          description: The requested employment type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateEmploymentType
      tags:
        - Employment Types
      summary: Update an employment type
      description: Updates an existing employment type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentTypeInput'
      responses:
        '200':
          description: The updated employment type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteEmploymentType
      tags:
        - Employment Types
      summary: Delete an employment type
      description: Deletes an employment type.
      responses:
        '204':
          description: The employment type was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/crew_custom_field_templates:
    get:
      operationId: listCrewCustomFieldTemplates
      tags:
        - Custom Field Templates
      summary: List crew custom field templates
      description: >-
        Lists the custom field templates that define additional fields attached
        to crew records for the tenant.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of custom field templates.
          headers:
            x-total-count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CrewCustomFieldTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createCrewCustomFieldTemplate
      tags:
        - Custom Field Templates
      summary: Create a crew custom field template
      description: Creates a new crew custom field template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrewCustomFieldTemplateInput'
      responses:
        '201':
          description: The created custom field template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/crew_custom_field_templates/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getCrewCustomFieldTemplate
      tags:
        - Custom Field Templates
      summary: Get a crew custom field template
      description: Retrieves a single crew custom field template by ID.
      responses:
        '200':
          description: The requested custom field template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateCrewCustomFieldTemplate
      tags:
        - Custom Field Templates
      summary: Update a crew custom field template
      description: Updates an existing crew custom field template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrewCustomFieldTemplateInput'
      responses:
        '200':
          description: The updated custom field template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrewCustomFieldTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteCrewCustomFieldTemplate
      tags:
        - Custom Field Templates
      summary: Delete a crew custom field template
      description: Deletes a crew custom field template.
      responses:
        '204':
          description: The custom field template was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/biz_establishments:
    get:
      operationId: listBizEstablishments
      tags:
        - Business Establishments
      summary: List business establishments
      description: >-
        Lists the business establishments (jigyosho) registered for the tenant,
        used for social insurance and labor administration.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of business establishments.
          headers:
            x-total-count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BizEstablishment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/webhooks:
    get:
      operationId: listWebhooks
      tags:
        - Webhooks
      summary: List webhooks
      description: Lists webhook subscriptions configured for the tenant.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of webhook subscriptions.
          headers:
            x-total-count:
              $ref: '#/components/headers/XTotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createWebhook
      tags:
        - Webhooks
      summary: Create a webhook
      description: >-
        Creates a webhook subscription. SmartHR will POST an event notification
        to the configured URL when subscribed events occur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '201':
          description: The created webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getWebhook
      tags:
        - Webhooks
      summary: Get a webhook
      description: Retrieves a single webhook subscription by ID.
      responses:
        '200':
          description: The requested webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateWebhook
      tags:
        - Webhooks
      summary: Update a webhook
      description: Updates an existing webhook subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '200':
          description: The updated webhook subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteWebhook
      tags:
        - Webhooks
      summary: Delete a webhook
      description: Deletes a webhook subscription.
      responses:
        '204':
          description: The webhook subscription was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Per-tenant access token issued from the SmartHR admin console (or
        obtained via OAuth2 for registered apps), passed as
        `Authorization: Bearer ACCESS_TOKEN`. HTTP Basic auth with the access
        token as the username (`curl -u ACCESS_TOKEN`) is also accepted.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The unique identifier of the resource.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      description: Number of records per page (max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  headers:
    XTotalCount:
      description: Total number of records matching the query.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Remaining requests in the current rate-limit window.
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        Rate limit exceeded. SmartHR allows 5,000 requests/hour and 10
        requests/second per access token, and 50,000 requests/minute per
        subdomain.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
        type:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    Crew:
      allOf:
        - $ref: '#/components/schemas/CrewInput'
        - type: object
          properties:
            id:
              type: string
              description: Unique crew identifier.
            emp_status:
              type: string
              description: Employment status.
              enum:
                - employed
                - absent
                - retired
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    CrewInput:
      type: object
      properties:
        emp_code:
          type: string
          description: Employee code within the organization.
        last_name:
          type: string
        first_name:
          type: string
        last_name_yomi:
          type: string
          description: Phonetic (kana) reading of the last name.
        first_name_yomi:
          type: string
          description: Phonetic (kana) reading of the first name.
        business_email:
          type: string
          format: email
        department_ids:
          type: array
          items:
            type: string
        employment_type_id:
          type: string
        gender:
          type: string
          enum:
            - male
            - female
            - other
        birth_at:
          type: string
          format: date
        entered_at:
          type: string
          format: date
          description: Date the employee joined.
        resigned_at:
          type: string
          format: date
          description: Date the employee resigned, if applicable.
    Department:
      allOf:
        - $ref: '#/components/schemas/DepartmentInput'
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    DepartmentInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        position:
          type: integer
          description: Display order among sibling departments.
        code:
          type: string
        parent_id:
          type: string
          description: ID of the parent department, if any.
    EmploymentType:
      allOf:
        - $ref: '#/components/schemas/EmploymentTypeInput'
        - type: object
          properties:
            id:
              type: string
            preset_type:
              type: string
              description: Preset employment type, if this is a built-in type.
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    EmploymentTypeInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    CrewCustomFieldTemplate:
      allOf:
        - $ref: '#/components/schemas/CrewCustomFieldTemplateInput'
        - type: object
          properties:
            id:
              type: string
            created_at:
              type: string
